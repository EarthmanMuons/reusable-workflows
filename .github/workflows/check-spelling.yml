name: check spelling

on:
  workflow_call:
    inputs:
      files:
        type: string
        default: "."

jobs:
  find_typos:
    name: find typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check files for common misspellings
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f
        with:
          files: "${{ inputs.files }}"

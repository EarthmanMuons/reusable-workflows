name: check github actions

on:
  workflow_call:
    inputs:
      zizmor_persona:
        type: string
        default: "regular"

jobs:
  lint_actionlint:
    name: lint workflows with actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflow files
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          group-result: false
          # TODO: actionlint 1.7.12 doesn't support the July 2026 self-repository syntax
          flags: -ignore reusable.*workflow.*call.*at.*uses.*is.*not.*following.*the.*format

  lint_zizmor:
    name: lint workflows with zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate zizmor persona
        env:
          INPUTS_ZIZMOR_PERSONA: ${{ inputs.zizmor_persona }}
        run: |
          case "${INPUTS_ZIZMOR_PERSONA}" in
            regular|pedantic|auditor) ;;
            *)
              echo "::error::Invalid zizmor_persona '${INPUTS_ZIZMOR_PERSONA}' (expected regular, pedantic, or auditor)."
              exit 1
              ;;
          esac

      - name: Lint GitHub Actions workflow files
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          persona: ${{ inputs.zizmor_persona }}
